# Sample configuration for estate-agency
# Adjust values per your environment or set CONFIG_PATH env to point to another file.

db_config:
  username: root
  password: root
  host: localhost
  port: "5432"
  database: estate
  max_attempts: 5
  seconds_to_connect: 5

geo_config:
  # Geoapify API key. If empty, the application will use a noop geocoder.
  api_key: ""
  # Optional: override base URL (default is Geoapify search endpoint)
  base_url: "https://api.geoapify.com/v1/geocode/search"

goose_path: db/migrations
