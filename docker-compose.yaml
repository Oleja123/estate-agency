services:
  backend:
      ports: 
        - "8080:8080"
      build:
        context: ./
      depends_on:
        db:
          condition: service_healthy
  db:
      image: postgis/postgis:16-3.4
      restart: unless-stopped
      ports: 
        - "1409:5432"
      environment:
        POSTGRES_PASSWORD: root
        POSTGRES_USER: root
        POSTGRES_DB: estate
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U root -d estate"]
        interval: 30s
        timeout: 5s 
        retries: 5
        start_period: 10s
      volumes:
        - db_data:/var/lib/postgresql/data
  
volumes:
  db_data: